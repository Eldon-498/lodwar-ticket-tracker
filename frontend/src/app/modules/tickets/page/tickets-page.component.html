<div class="page">
  <header class="page-header">
    <div>
      <h1>Lodwar Ticket Tracker</h1>
      <p class="subtitle">Track and triage support tickets</p>
    </div>

    @if (stats) {
      <div class="stats">
        <div class="stat">
          <span class="stat-label">Total</span>
          <span class="stat-value">{{ stats.total }}</span>
        </div>
        <div class="stat">
          <span class="stat-label">Open</span>
          <span class="stat-value">{{ countFor('OPEN') }}</span>
        </div>
        <div class="stat">
          <span class="stat-label">In progress</span>
          <span class="stat-value">{{ countFor('IN_PROGRESS') }}</span>
        </div>
        <div class="stat">
          <span class="stat-label">Closed</span>
          <span class="stat-value">{{ countFor('CLOSED') }}</span>
        </div>
      </div>
    }
  </header>

  <section class="section">
    <h2>Create ticket</h2>
    <lodwar-ticket-create (created)="onTicketCreated()"></lodwar-ticket-create>
  </section>

  <section class="section">
    <h2>Tickets</h2>
    <lodwar-ticket-list (statusChanged)="onTicketStatusChanged()"></lodwar-ticket-list>
  </section>
</div>
