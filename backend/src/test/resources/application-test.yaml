spring:
  datasource:
    url: jdbc:mysql://localhost:${LODWAR_MYSQL_PORT:3307}/${LODWAR_MYSQL_TEST_DB:lodwar_test}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
    username: ${LODWAR_MYSQL_USER:lodwar}
    password: ${LODWAR_MYSQL_PASSWORD:lodwar}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:migrations
    validate-migration-naming: true
    clean-disabled: false
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false
        show_sql: false
